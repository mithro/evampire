<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="640" height="330" fill="white"/>
<defs><marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c55a11"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c00000"/></marker></defs>
<rect x="20.0" y="260.0" width="570.0" height="50.0" rx="0" fill="#dbe8f5" stroke="#222222"/>
<text x="305.0" y="292.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">substrate, at the chip ground</text>
<rect x="20.0" y="66.0" width="570.0" height="194.0" rx="0" fill="#e8e8e8" stroke="#222222"/>
<text x="596.0" y="243.0" text-anchor="start" font-size="11" font-weight="normal" fill="#7f7f7f">M1</text>
<text x="596.0" y="198.0" text-anchor="start" font-size="11" font-weight="normal" fill="#7f7f7f">M2</text>
<text x="596.0" y="153.0" text-anchor="start" font-size="11" font-weight="normal" fill="#7f7f7f">M3</text>
<text x="596.0" y="108.0" text-anchor="start" font-size="11" font-weight="normal" fill="#7f7f7f">M4</text>
<text x="596.0" y="63.0" text-anchor="start" font-size="11" font-weight="normal" fill="#7f7f7f">M5</text>
<line x1="20.0" y1="217.0" x2="590.0" y2="217.0" stroke="#7f7f7f" stroke-width="0.6" stroke-dasharray="4,3"/>
<line x1="20.0" y1="172.0" x2="590.0" y2="172.0" stroke="#7f7f7f" stroke-width="0.6" stroke-dasharray="4,3"/>
<line x1="20.0" y1="127.0" x2="590.0" y2="127.0" stroke="#7f7f7f" stroke-width="0.6" stroke-dasharray="4,3"/>
<line x1="20.0" y1="82.0" x2="590.0" y2="82.0" stroke="#7f7f7f" stroke-width="0.6" stroke-dasharray="4,3"/>
<rect x="200.0" y="232.0" width="200.0" height="14.0" rx="0" fill="#9aa5b1" stroke="#222222"/>
<text x="410.0" y="243.0" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">M1 plate: chip side</text>
<rect x="200.0" y="52.0" width="200.0" height="14.0" rx="0" fill="#e6b8a2" stroke="#c00000"/>
<text x="300.0" y="44.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#c00000">M5 plate: cable side</text>
<rect x="450.0" y="52.0" width="110.0" height="14.0" rx="0" fill="#e6b8a2" stroke="#c00000"/>
<text x="505.0" y="44.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#c00000">bond pad to the cable</text>
<line x1="215.0" y1="68.0" x2="215.0" y2="228.0" stroke="#c00000" stroke-width="1.2" marker-end="url(#r)"/>
<line x1="255.0" y1="68.0" x2="255.0" y2="228.0" stroke="#c00000" stroke-width="1.2" marker-end="url(#r)"/>
<line x1="345.0" y1="68.0" x2="345.0" y2="228.0" stroke="#c00000" stroke-width="1.2" marker-end="url(#r)"/>
<line x1="385.0" y1="68.0" x2="385.0" y2="228.0" stroke="#c00000" stroke-width="1.2" marker-end="url(#r)"/>
<text x="30.0" y="140.0" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">4 oxide layers,</text>
<text x="30.0" y="155.0" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">1.15 µm to 1.45 µm</text>
<text x="30.0" y="170.0" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">each, 4.6 µm to</text>
<text x="30.0" y="185.0" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">5.8 µm in all</text>
<text x="300.0" y="130.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#c00000">oxide strength</text>
<text x="300.0" y="146.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#c00000">about 500 V rms/µm:</text>
<text x="300.0" y="162.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#c00000">2300 V rms to</text>
<text x="300.0" y="178.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#c00000">2900 V rms</text>
<text x="505.0" y="140.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">everything connected</text>
<text x="505.0" y="155.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">to the cable sits on</text>
<text x="505.0" y="170.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">the top metal, above</text>
<text x="505.0" y="185.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">the whole oxide stack</text>
</svg>
