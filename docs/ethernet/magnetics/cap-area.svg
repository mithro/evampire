<svg xmlns="http://www.w3.org/2000/svg" width="660" height="330" viewBox="0 0 660 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="660" height="330" fill="white"/>
<defs><marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c55a11"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c00000"/></marker></defs>
<text x="165.0" y="22.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">N devices in series</text>
<text x="495.0" y="22.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Two kinds of on-chip capacitor</text>
<rect x="20.0" y="50.0" width="22.0" height="22.0" rx="0" fill="#fff2cc" stroke="#222222"/>
<text x="54.0" y="65.0" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">N = 1: area 1×</text>
<rect x="20.0" y="94.0" width="31.1" height="31.1" rx="0" fill="#fff2cc" stroke="#222222"/>
<line x1="51.1" y1="109.6" x2="59.1" y2="109.6" stroke="#222222" stroke-width="1.5"/>
<rect x="59.1" y="94.0" width="31.1" height="31.1" rx="0" fill="#fff2cc" stroke="#222222"/>
<text x="102.2" y="113.6" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">N = 2: area 4×</text>
<rect x="20.0" y="147.1" width="38.1" height="38.1" rx="0" fill="#fff2cc" stroke="#222222"/>
<line x1="58.1" y1="166.2" x2="66.1" y2="166.2" stroke="#222222" stroke-width="1.5"/>
<rect x="66.1" y="147.1" width="38.1" height="38.1" rx="0" fill="#fff2cc" stroke="#222222"/>
<line x1="104.2" y1="166.2" x2="112.2" y2="166.2" stroke="#222222" stroke-width="1.5"/>
<rect x="112.2" y="147.1" width="38.1" height="38.1" rx="0" fill="#fff2cc" stroke="#222222"/>
<text x="162.3" y="170.2" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">N = 3: area 9×</text>
<text x="20.0" y="215.2" text-anchor="start" font-size="11" font-weight="normal" fill="#7f7f7f">each device N times larger,</text>
<text x="20.0" y="229.2" text-anchor="start" font-size="11" font-weight="normal" fill="#7f7f7f">so the area grows as N²</text>
<line x1="330.0" y1="10.0" x2="330.0" y2="320.0" stroke="#7f7f7f" stroke-width="0.8"/>
<rect x="350.0" y="60.0" width="290.0" height="190.0" rx="0" fill="#e8e8e8" stroke="#222222"/>
<text x="644.0" y="244.0" text-anchor="start" font-size="10" font-weight="normal" fill="#7f7f7f">M1</text>
<text x="644.0" y="199.0" text-anchor="start" font-size="10" font-weight="normal" fill="#7f7f7f">M2</text>
<text x="644.0" y="154.0" text-anchor="start" font-size="10" font-weight="normal" fill="#7f7f7f">M3</text>
<text x="644.0" y="109.0" text-anchor="start" font-size="10" font-weight="normal" fill="#7f7f7f">M4</text>
<text x="644.0" y="70.0" text-anchor="start" font-size="10" font-weight="normal" fill="#7f7f7f">M5</text>
<rect x="370.0" y="92.0" width="100.0" height="8.0" rx="0" fill="#9aa5b1" stroke="#222222"/>
<rect x="370.0" y="104.0" width="100.0" height="8.0" rx="0" fill="#9aa5b1" stroke="#222222"/>
<text x="420.0" y="84.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">MIM capacitor</text>
<text x="420.0" y="132.0" text-anchor="middle" font-size="10" font-weight="normal" fill="#222222">thin insulator:</text>
<text x="420.0" y="145.0" text-anchor="middle" font-size="10" font-weight="normal" fill="#222222">2.0 fF/µm², 6.6 V</text>
<text x="420.0" y="158.0" text-anchor="middle" font-size="10" font-weight="normal" fill="#222222">16 nF in 8.0 mm²</text>
<rect x="500.0" y="58.0" width="120.0" height="8.0" rx="0" fill="#9aa5b1" stroke="#222222"/>
<rect x="500.0" y="236.0" width="120.0" height="8.0" rx="0" fill="#9aa5b1" stroke="#222222"/>
<line x1="612.0" y1="70.0" x2="612.0" y2="232.0" stroke="#c00000" stroke-width="1.2"/>
<text x="553.0" y="130.0" text-anchor="middle" font-size="10" font-weight="normal" fill="#c00000">whole stack,</text>
<text x="553.0" y="143.0" text-anchor="middle" font-size="10" font-weight="normal" fill="#c00000">about 5 µm:</text>
<text x="553.0" y="156.0" text-anchor="middle" font-size="10" font-weight="normal" fill="#c00000">0.0069 fF/µm²</text>
<text x="553.0" y="169.0" text-anchor="middle" font-size="10" font-weight="normal" fill="#c00000">16 nF in</text>
<text x="553.0" y="182.0" text-anchor="middle" font-size="10" font-weight="normal" fill="#c00000">about 2300 mm²</text>
<text x="495.0" y="275.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#7f7f7f">schematic, not to scale</text>
