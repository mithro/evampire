<text x="270.0" y="283.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#222222" dominant-baseline="middle">Each pair: two wires twisted together, with a</text>
<text x="270.0" y="298.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#222222" dominant-baseline="middle">differential impedance of 100 Ω. Its signal is the</text>
<text x="270.0" y="313.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#222222" dominant-baseline="middle">voltage between its wires: for pair A, the voltage</text>
<text x="270.0" y="328.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#222222" dominant-baseline="middle">of contact 1 minus that of contact 2.</text>
