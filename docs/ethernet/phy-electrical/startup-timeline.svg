<text x="450.6" y="315.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#222222" dominant-baseline="middle">2500</text>
<text x="243.0" y="336.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#222222" dominant-baseline="middle">Time after the autonegotiation result (ms)</text>
<text x="43.1" y="43.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#777777" dominant-baseline="middle">page</text>
<text x="43.1" y="57.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#777777" dominant-baseline="middle">exchange</text>
<text x="43.1" y="251.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#777777" dominant-baseline="middle">bursts</text>
<text x="43.1" y="264.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#777777" dominant-baseline="middle">every</text>
<text x="43.1" y="277.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#777777" dominant-baseline="middle">8 ms to</text>
<text x="43.1" y="290.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#777777" dominant-baseline="middle">24 ms</text>
<text x="20.0" y="22.0" font-size="12" text-anchor="start" font-weight="normal" fill="#777777" dominant-baseline="middle">Each bar is solid to the timer's minimum and pale to its maximum.</text>
