<text x="70.1" y="138.2" font-size="12" text-anchor="start" font-weight="normal" fill="#222222" dominant-baseline="middle">Master trains: maxwait_timer, 750 ms ± 10 ms</text>
<rect x="66.1" y="206.8" width="115.3" height="14.0" rx="0" fill="#2e7d32" stroke="none" stroke-width="1.0"/>
<rect x="181.5" y="206.8" width="38.4" height="14.0" rx="0" fill="#2e7d32" stroke="none" stroke-width="1.0"/>
<rect x="181.5" y="206.8" width="38.4" height="14" fill="#ffffff" fill-opacity="0.6"/>
<text x="70.1" y="195.8" font-size="12" text-anchor="start" font-weight="normal" fill="#222222" dominant-baseline="middle">link_fail_inhibit_timer, 750 ms to 1000 ms: the link must be up</text>
<rect x="219.9" y="264.2" width="184.6" height="14.0" rx="0" fill="#c0392b" stroke="none" stroke-width="1.0"/>
<rect x="404.5" y="264.2" width="46.1" height="14.0" rx="0" fill="#c0392b" stroke="none" stroke-width="1.0"/>
<rect x="404.5" y="264.2" width="46.1" height="14" fill="#ffffff" fill-opacity="0.6"/>
<text x="70.1" y="239.2" font-size="12" text-anchor="start" font-weight="normal" fill="#222222" dominant-baseline="middle">If no link by then: silent for break_link_timer,</text>
<text x="70.1" y="253.2" font-size="12" text-anchor="start" font-weight="normal" fill="#222222" dominant-baseline="middle">1200 ms to 1500 ms, then negotiation restarts</text>
</svg>
