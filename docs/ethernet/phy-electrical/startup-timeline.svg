<text x="296.8" y="315.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#222222" dominant-baseline="middle">1500</text>
<line x1="373.7" y1="300.0" x2="373.7" y2="305.0" stroke="#222222" stroke-width="1.2"/>
<text x="373.7" y="315.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#222222" dominant-baseline="middle">2000</text>
