<text x="70.1" y="80.8" font-size="12" text-anchor="start" font-weight="normal" fill="#222222" dominant-baseline="middle">Slave trains: maxwait_timer, 350 ms ± 5 ms</text>
<rect x="66.1" y="149.2" width="113.8" height="14.0" rx="0" fill="#1f4e79" stroke="none" stroke-width="1.0"/>
<rect x="179.9" y="149.2" width="3.1" height="14.0" rx="0" fill="#1f4e79" stroke="none" stroke-width="1.0"/>
