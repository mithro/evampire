<svg xmlns="http://www.w3.org/2000/svg" width="640" height="245" viewBox="0 0 640 245">
<title>Vertical PNP cross-section</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect width="640" height="245" fill="#ffffff"/>
<rect x="20.0" y="90.0" width="600.0" height="140.0" rx="0" fill="#dbe8f5" stroke="#000000" stroke-width="1.0"/>
<text x="320.0" y="215.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#000000">P substrate: collector</text>
<rect x="130.0" y="90.0" width="310.0" height="90.0" rx="0" fill="#fbd9b5" stroke="#000000" stroke-width="1.0"/>
<text x="380.0" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#000000">N-well: base</text>
<rect x="190.0" y="90.0" width="90.0" height="24.0" rx="0" fill="#7fa7d6" stroke="#000000" stroke-width="1.0"/>
<text x="235.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#000000">P+ emitter</text>
<rect x="360.0" y="90.0" width="60.0" height="24.0" rx="0" fill="#f4b183" stroke="#000000" stroke-width="1.0"/>
<text x="390.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#000000">N+</text>
<rect x="520.0" y="90.0" width="70.0" height="24.0" rx="0" fill="#7fa7d6" stroke="#000000" stroke-width="1.0"/>
<text x="555.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#000000">P+</text>
<line x1="235.0" y1="90.0" x2="235.0" y2="58.0" stroke="#000000" stroke-width="1.4"/>
<text x="235.0" y="50.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#000000">E</text>
<line x1="390.0" y1="90.0" x2="390.0" y2="58.0" stroke="#000000" stroke-width="1.4"/>
<text x="390.0" y="50.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#000000">B</text>
<line x1="555.0" y1="90.0" x2="555.0" y2="58.0" stroke="#000000" stroke-width="1.4"/>
<text x="555.0" y="50.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#000000">C, 0 V</text>
<line x1="235.0" y1="118.0" x2="235.0" y2="200.0" stroke="#000000" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="245.0" y="140.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#000000">holes cross the base</text>
<text x="245.0" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#000000">to the substrate</text>
<text x="20.0" y="22.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#000000">VBE 0.63 to 0.83 V, current gain 0.8 to 2.4</text>
<text x="620.0" y="22.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#7f7f7f">the collector is always the substrate</text>
</svg>
