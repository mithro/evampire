<text x="10.0" y="378.0" font-family="Helvetica, Arial, sans-serif" font-size="15.0" text-anchor="start" font-weight="normal" fill="#7f7f7f">Bars: the inner receive mask (the eye). Grey band: 0.4825 to 0.6425 V, inside every eye.</text>
<text x="10.0" y="396.0" font-family="Helvetica, Arial, sans-serif" font-size="15.0" text-anchor="start" font-weight="normal" fill="#7f7f7f">Arrows: TPS65987D switching levels, typical, a reference example.</text>
