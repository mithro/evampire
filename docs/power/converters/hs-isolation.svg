<text x="210.0" y="330.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#222222" dominant-baseline="middle">deep n-well, up to 62 V</text>
<rect x="80.0" y="260.0" width="120.0" height="45.0" rx="6" fill="#c3d7ee" stroke="#222222" stroke-width="1.0"/>
<text x="140.0" y="276.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222" dominant-baseline="middle">p-well</text>
<text x="140.0" y="293.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222222" dominant-baseline="middle">switch node, 57 V</text>
<rect x="220.0" y="260.0" width="120.0" height="45.0" rx="6" fill="#fbd9b5" stroke="#222222" stroke-width="1.0"/>
<text x="280.0" y="276.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222" dominant-baseline="middle">n-well</text>
<text x="280.0" y="293.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#222222" dominant-baseline="middle">driver supply, 62 V</text>
<path d="M60,270 L60,340 L360,340 L360,270" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="6 4" fill="none"/>
<text x="375.0" y="278.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222222" dominant-baseline="middle">about 5 V across the</text>
<text x="375.0" y="292.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222222" dominant-baseline="middle">inner junctions</text>
<text x="375.0" y="313.0" font-size="12" text-anchor="start" font-weight="normal" fill="#c0392b" dominant-baseline="middle">deep n-well to substrate:</text>
<text x="375.0" y="327.0" font-size="12" text-anchor="start" font-weight="normal" fill="#c0392b" dominant-baseline="middle">breakdown an open question</text>
<text x="300.0" y="404.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#222222" dominant-baseline="middle">(c) Polysilicon devices on field oxide</text>
<rect x="20.0" y="450.0" width="560.0" height="105.0" rx="0" fill="#dbe8f5" stroke="#222222" stroke-width="1.0"/>
<text x="470.0" y="540.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#222222" dominant-baseline="middle">P-type substrate, 0 V</text>
