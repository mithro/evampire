<text x="66.0" y="443.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222222" dominant-baseline="middle">field oxide</text>
<rect x="110.0" y="422.0" width="220.0" height="13.0" rx="0" fill="#c9a0dc" stroke="#222222" stroke-width="1.0"/>
<text x="340.0" y="422.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222222" dominant-baseline="middle">polysilicon devices, 57 V to 62 V</text>
<path d="M60,450 L380,450" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="6 4" fill="none"/>
<text x="395.0" y="464.0" font-size="12" text-anchor="start" font-weight="normal" fill="#c0392b" dominant-baseline="middle">no junction to the</text>
<text x="395.0" y="478.0" font-size="12" text-anchor="start" font-weight="normal" fill="#c0392b" dominant-baseline="middle">substrate; field oxide</text>
<text x="395.0" y="492.0" font-size="12" text-anchor="start" font-weight="normal" fill="#c0392b" dominant-baseline="middle">breakdown an open</text>
<text x="395.0" y="506.0" font-size="12" text-anchor="start" font-weight="normal" fill="#c0392b" dominant-baseline="middle">question</text>
<text x="300.0" y="585.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#777777" dominant-baseline="middle">Red dashed lines: where the full voltage to the substrate is held</text>
