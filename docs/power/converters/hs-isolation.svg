<text x="300.0" y="103.0" font-size="12" text-anchor="start" font-weight="normal" fill="#c0392b" dominant-baseline="middle">junction holds up to 62 V;</text>
<text x="300.0" y="117.0" font-size="12" text-anchor="start" font-weight="normal" fill="#c0392b" dominant-baseline="middle">documented breakdown 10 V minimum</text>
<text x="300.0" y="50.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#777777" dominant-baseline="middle">driver supply 5 V above a 57 V switch node</text>
<text x="300.0" y="214.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#222222" dominant-baseline="middle">(b) Deep n-well around the driver</text>
