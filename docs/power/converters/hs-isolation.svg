<text x="470.0" y="160.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#222222" dominant-baseline="middle">P-type substrate, 0 V</text>
<rect x="80.0" y="70.0" width="200.0" height="55.0" rx="8" fill="#fbd9b5" stroke="#222222" stroke-width="1.0"/>
<text x="180.0" y="90.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222" dominant-baseline="middle">n-well of the driver</text>
<text x="180.0" y="108.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#222222" dominant-baseline="middle">up to 62 V</text>
