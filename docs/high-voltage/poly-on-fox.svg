<svg xmlns="http://www.w3.org/2000/svg" width="640" height="490" viewBox="0 0 640 490" font-family="sans-serif" font-size="13">
<rect width="640" height="490" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<text x="20" y="24" text-anchor="start" font-size="14" font-weight="bold" fill="#222222">(a) Polysilicon diodes on the field oxide</text>
<rect x="20" y="100" width="600" height="100" rx="0" fill="#dbe8f5" stroke="#222222"/>
<text x="320" y="188" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">P substrate, 0 V</text>
<rect x="60" y="84" width="520" height="18" rx="0" fill="#cfcfcf" stroke="#222222"/>
<rect x="80" y="68" width="40" height="16" rx="0" fill="#7fa7d6" stroke="#222222"/>
<text x="100.0" y="80" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">P</text>
<rect x="120" y="68" width="40" height="16" rx="0" fill="#f5b46e" stroke="#222222"/>
<text x="140.0" y="80" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">N</text>
<rect x="160" y="68" width="40" height="16" rx="0" fill="#7fa7d6" stroke="#222222"/>
<text x="180.0" y="80" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">P</text>
<rect x="200" y="68" width="40" height="16" rx="0" fill="#f5b46e" stroke="#222222"/>
<text x="220.0" y="80" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">N</text>
<rect x="240" y="68" width="40" height="16" rx="0" fill="#7fa7d6" stroke="#222222"/>
<text x="260.0" y="80" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">P</text>
<rect x="280" y="68" width="40" height="16" rx="0" fill="#f5b46e" stroke="#222222"/>
<text x="300.0" y="80" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">N</text>
<rect x="320" y="68" width="40" height="16" rx="0" fill="#7fa7d6" stroke="#222222"/>
<text x="340.0" y="80" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">P</text>
<rect x="360" y="68" width="40" height="16" rx="0" fill="#f5b46e" stroke="#222222"/>
<text x="380.0" y="80" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">N</text>
<rect x="400" y="68" width="40" height="16" rx="0" fill="#7fa7d6" stroke="#222222"/>
<text x="420.0" y="80" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">P</text>
<rect x="440" y="68" width="40" height="16" rx="0" fill="#f5b46e" stroke="#222222"/>
<text x="460.0" y="80" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">N</text>
<rect x="480" y="68" width="40" height="16" rx="0" fill="#7fa7d6" stroke="#222222"/>
<text x="500.0" y="80" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">P</text>
<rect x="520" y="68" width="40" height="16" rx="0" fill="#f5b46e" stroke="#222222"/>
<text x="540.0" y="80" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">N</text>
<text x="80" y="62" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">57 V</text>
<text x="560" y="62" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">0 V</text>
<text x="320" y="50" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">a polysilicon strip: the voltage steps along it at its P-N junctions</text>
<line x1="300" y1="116" x2="300" y2="104" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="310" y="124" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">field oxide holds the whole voltage to the substrate:</text>
<text x="310" y="140" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">0.31 µm equivalent, 1.83 MV/cm at 57 V</text>
<text x="80" y="98" text-anchor="start" font-size="11" font-weight="normal" fill="#222222">field oxide</text>
<text x="20" y="240" text-anchor="start" font-size="14" font-weight="bold" fill="#222222">(b) Polysilicon at tens of volts inverts the silicon under it</text>
<rect x="20" y="300" width="290" height="150" rx="0" fill="#dbe8f5" stroke="#222222"/>
<rect x="40" y="300" width="50" height="20" rx="0" fill="#f5b46e" stroke="#222222"/>
<rect x="240" y="300" width="50" height="20" rx="0" fill="#f5b46e" stroke="#222222"/>
<text x="65" y="340" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">N, 0 V</text>
<text x="265" y="340" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">N, 5 V</text>
<rect x="70" y="288" width="190" height="12" rx="0" fill="#cfcfcf" stroke="#222222"/>
<rect x="80" y="272" width="170" height="16" rx="0" fill="#c9a0dc" stroke="#222222"/>
<text x="165" y="285" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">polysilicon at 40 V</text>
<path d="M90,302 L240,302" stroke="#2e86de" stroke-width="4"/>
<text x="165" y="390" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">inversion layer joins</text>
<text x="165" y="406" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">the two N regions</text>
<text x="165" y="440" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">P substrate, 0 V</text>
<rect x="330" y="300" width="290" height="150" rx="0" fill="#dbe8f5" stroke="#222222"/>
<rect x="350" y="300" width="50" height="20" rx="0" fill="#f5b46e" stroke="#222222"/>
<rect x="550" y="300" width="50" height="20" rx="0" fill="#f5b46e" stroke="#222222"/>
<text x="375" y="340" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">N, 0 V</text>
<text x="575" y="340" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">N, 5 V</text>
<rect x="380" y="288" width="190" height="12" rx="0" fill="#cfcfcf" stroke="#222222"/>
<rect x="390" y="272" width="170" height="16" rx="0" fill="#c9a0dc" stroke="#222222"/>
<text x="475" y="285" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">polysilicon at 40 V</text>
<path d="M400,302 L455,302" stroke="#2e86de" stroke-width="4"/>
<path d="M495,302 L550,302" stroke="#2e86de" stroke-width="4"/>
<rect x="457" y="300" width="36" height="18" rx="0" fill="#5b8cc7" stroke="#222222"/>
<text x="475" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#222222">P+ cut</text>
<text x="475" y="390" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">the P+ stops the</text>
<text x="475" y="406" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">inversion: no path</text>
<text x="475" y="440" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">P substrate, 0 V</text>
<line x1="40" y1="470" x2="64" y2="470" stroke="#2e86de" stroke-width="4"/>
<text x="72" y="474" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">inversion layer of electrons</text>
</svg>
