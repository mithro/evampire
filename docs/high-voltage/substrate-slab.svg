<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="sans-serif" font-size="13">
<rect width="640" height="300" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<defs><linearGradient id="fall" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#f5b46e"/><stop offset="1" stop-color="#dbe8f5"/></linearGradient></defs>
<path d="M110,120 L170,84.0 L590,84.0 L530,120 Z" fill="url(#fall)" stroke="#222222"/>
<path d="M530,120 L590,84.0 L590,144.0 L530,180 Z" fill="#dbe8f5" stroke="#222222"/>
<rect x="110" y="120" width="420" height="60" fill="url(#fall)" stroke="#222222"/>
<rect x="96" y="120" width="14" height="60" rx="0" fill="#9aa5b1" stroke="#222222"/>
<rect x="530" y="120" width="14" height="60" rx="0" fill="#9aa5b1" stroke="#222222"/>
<text x="90" y="156" text-anchor="end" font-size="14" font-weight="bold" fill="#222222">57 V</text>
<text x="600" y="126" text-anchor="start" font-size="14" font-weight="bold" fill="#222222">0 V</text>
<line x1="110" y1="204" x2="530" y2="204" stroke="#222222" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="320.0" y="220" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">1 mm long, 1 mm wide, 300 µm thick: the voltage falls evenly along it</text>
<text x="320" y="30" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">P-type silicon at 10¹⁵ cm⁻³, about 14 Ω·cm</text>
<text x="320" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">about 450 Ω between the contacts: 130 mA and 7 W at 57 V</text>
</svg>
