<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="sans-serif" font-size="13">
<rect width="640" height="400" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect x="90" y="40" width="520" height="290" rx="0" fill="none" stroke="#222222"/>
<line x1="90.0" y1="40" x2="90.0" y2="330" stroke="#dddddd" stroke-width="1"/>
<text x="90.0" y="347" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">0</text>
<line x1="90" y1="330.0" x2="610" y2="330.0" stroke="#dddddd" stroke-width="1"/>
<text x="84" y="334.0" text-anchor="end" font-size="12" font-weight="normal" fill="#222222">0</text>
<text x="350.0" y="368" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">well voltage (no scale: schematic)</text>
<text x="40" y="185.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222" transform="rotate(-90 40 185.0)">ring 1 voltage</text>
