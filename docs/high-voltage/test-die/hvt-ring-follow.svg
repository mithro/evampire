<text x="402.0" y="138.6" text-anchor="end" font-size="12" font-weight="normal" fill="#666666">ring = well</text>
<polyline points="90.0,330.0 235.6,330.0 266.8,321.3 610.0,138.6" stroke="#2e86de" stroke-width="2.4" fill="none"/>
<text x="235.6" y="284.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">punch-through voltage:</text>
