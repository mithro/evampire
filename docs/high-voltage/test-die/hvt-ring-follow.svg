<line x1="235.6" y1="306.0" x2="235.6" y2="326.0" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="506.0" y1="100.0" x2="506.0" y2="191.7" stroke="#222222" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
