<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="sans-serif" font-size="13">
<rect width="640" height="400" fill="white"/>
<text x="160" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Resistor divider</text>
<circle cx="70" cy="50" r="4" fill="#222222"/>
<text x="60" y="54" text-anchor="end" font-size="11" font-weight="normal" fill="#222222">57 V node</text>
<polyline points="70,50 70,58 78,61.7 62,69.0 78,76.3 62,83.7 78,91.0 62,98.3 70,102 70,110" stroke="#222222" stroke-width="1.6" fill="none"/>
<polyline points="70,110 70,118 78,121.7 62,129.0 78,136.3 62,143.7 78,151.0 62,158.3 70,162 70,170" stroke="#222222" stroke-width="1.6" fill="none"/>
<line x1="70" y1="110" x2="120" y2="110" stroke="#222222" stroke-width="1.5"/>
<line x1="60" y1="170" x2="80" y2="170" stroke="#222222" stroke-width="2"/>
<line x1="64" y1="174" x2="76" y2="174" stroke="#222222" stroke-width="1.5"/>
<line x1="68" y1="178" x2="72" y2="178" stroke="#222222" stroke-width="1.5"/>
<text x="158" y="90" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">a DC reading,</text>
<text x="158" y="106" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">but it draws current:</text>
<text x="158" y="122" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">57 µW at 1 µA</text>
<text x="480" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Capacitor divider</text>
<circle cx="390" cy="50" r="4" fill="#222222"/>
<text x="380" y="54" text-anchor="end" font-size="11" font-weight="normal" fill="#222222">57 V node</text>
<line x1="390" y1="50" x2="390" y2="76.0" stroke="#222222" stroke-width="1.5"/>
<line x1="378" y1="76.0" x2="402" y2="76.0" stroke="#222222" stroke-width="2"/>
<line x1="378" y1="84.0" x2="402" y2="84.0" stroke="#222222" stroke-width="2"/>
<line x1="390" y1="84.0" x2="390" y2="110" stroke="#222222" stroke-width="1.5"/>
<line x1="390" y1="110" x2="390" y2="136.0" stroke="#222222" stroke-width="1.5"/>
<line x1="378" y1="136.0" x2="402" y2="136.0" stroke="#222222" stroke-width="2"/>
<line x1="378" y1="144.0" x2="402" y2="144.0" stroke="#222222" stroke-width="2"/>
<line x1="390" y1="144.0" x2="390" y2="170" stroke="#222222" stroke-width="1.5"/>
<line x1="380" y1="170" x2="400" y2="170" stroke="#222222" stroke-width="2"/>
<line x1="384" y1="174" x2="396" y2="174" stroke="#222222" stroke-width="1.5"/>
<line x1="388" y1="178" x2="392" y2="178" stroke="#222222" stroke-width="1.5"/>
<line x1="390" y1="110" x2="440" y2="110" stroke="#222222" stroke-width="1.5"/>
<rect x="440" y="102" width="26" height="16" rx="0" fill="#c9a0dc" stroke="#222222"/>
<text x="396" y="100" text-anchor="start" font-size="10" font-weight="normal" fill="#c0392b">floating node</text>
<text x="453" y="132" text-anchor="middle" font-size="10" font-weight="normal" fill="#222222">gate</text>
<text x="478" y="90" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">no current, but no DC:</text>
<text x="478" y="106" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">the middle node's charge</text>
<text x="478" y="122" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">leaks and starts unknown</text>
<text x="160" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Junction-device stack</text>
<circle cx="70" cy="245" r="4" fill="#222222"/>
<text x="60" y="249" text-anchor="end" font-size="11" font-weight="normal" fill="#222222">57 V node</text>
<line x1="70" y1="245" x2="70" y2="365" stroke="#222222" stroke-width="1.5"/>
<polygon points="62,271 78,271 70,259" fill="#222222"/>
<line x1="62" y1="259" x2="78" y2="259" stroke="#222222" stroke-width="2"/>
<polygon points="62,301 78,301 70,289" fill="#222222"/>
<line x1="62" y1="289" x2="78" y2="289" stroke="#222222" stroke-width="2"/>
<polygon points="62,331 78,331 70,319" fill="#222222"/>
<line x1="62" y1="319" x2="78" y2="319" stroke="#222222" stroke-width="2"/>
<polygon points="62,361 78,361 70,349" fill="#222222"/>
<line x1="62" y1="349" x2="78" y2="349" stroke="#222222" stroke-width="2"/>
<line x1="60" y1="367" x2="80" y2="367" stroke="#222222" stroke-width="2"/>
<line x1="64" y1="371" x2="76" y2="371" stroke="#222222" stroke-width="1.5"/>
<line x1="68" y1="375" x2="72" y2="375" stroke="#222222" stroke-width="1.5"/>
<text x="158" y="285" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">every node also faces</text>
<text x="158" y="301" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">the substrate: the</text>
<text x="158" y="317" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">substrate limit</text>
<text x="480" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Metal-gate transistor</text>
<circle cx="390" cy="245" r="4" fill="#222222"/>
<text x="380" y="249" text-anchor="end" font-size="11" font-weight="normal" fill="#222222">57 V node</text>
<line x1="390" y1="245" x2="390" y2="275" stroke="#222222" stroke-width="1.5"/>
<rect x="360" y="275" width="60" height="8" rx="0" fill="#9aa5b1" stroke="#222222"/>
<rect x="360" y="283" width="60" height="40" rx="0" fill="#e8e8e8" stroke="#222222"/>
<line x1="360" y1="327" x2="420" y2="327" stroke="#2e86de" stroke-width="4"/>
<text x="390" y="307" text-anchor="middle" font-size="10" font-weight="normal" fill="#222222">insulator</text>
<text x="390" y="347" text-anchor="middle" font-size="10" font-weight="normal" fill="#222222">source, drain</text>
<text x="390" y="361" text-anchor="middle" font-size="10" font-weight="normal" fill="#222222">at low voltage</text>
<text x="478" y="285" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">a DC reading with</text>
<text x="478" y="301" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">no current from the node;</text>
<text x="478" y="317" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">its threshold is measured</text>
<line x1="320" y1="10" x2="320" y2="390" stroke="#dddddd" stroke-width="1"/>
<line x1="10" y1="205" x2="630" y2="205" stroke="#dddddd" stroke-width="1"/>
</svg>
