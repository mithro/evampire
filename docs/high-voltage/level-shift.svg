<text x="144" y="147" text-anchor="end" font-size="12" font-weight="normal" fill="#222222">Metal1 plate</text>
<circle cx="150" cy="196" r="3.5" fill="#222222"/>
<circle cx="260" cy="196" r="3.5" fill="#222222"/>
