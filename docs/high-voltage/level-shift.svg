<text x="320" y="274" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">drains at 1 V</text>
<line x1="320" y1="288" x2="320" y2="318" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="328" y="314" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">logic out, ground referenced</text>
<text x="320" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">I<tspan dy="4" font-size="0.75em">1</tspan><tspan dy="-4"> </tspan>− I<tspan dy="4" font-size="0.75em">2</tspan><tspan dy="-4"> </tspan>= (W/L) μ<tspan dy="4" font-size="0.75em">n</tspan><tspan dy="-4"> </tspan>C<tspan dy="4" font-size="0.75em">ox</tspan><tspan dy="-4"> </tspan>ΔV V<tspan dy="4" font-size="0.75em">DS</tspan><tspan dy="-4"> </tspan>= 58.6 µA</text>
<text x="320" y="396" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">at every floating voltage, for Metal1, W/L = 10, ΔV = 5 V and V<tspan dy="4" font-size="0.75em">DS</tspan><tspan dy="-4"> </tspan>= 1 V</text>
<text x="320" y="420" text-anchor="middle" font-size="13" font-weight="normal" fill="#666666">The floating circuit must stay above both thresholds: 11 V typical on Metal1</text>
</svg>
