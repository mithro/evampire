<text x="496" y="147" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">Metal1 plate</text>
<circle cx="490" cy="196" r="3.5" fill="#222222"/>
<circle cx="380" cy="196" r="3.5" fill="#222222"/>
<line x1="205" y1="76" x2="205" y2="138" stroke="#222222" stroke-width="1.5"/>
<text x="211" y="110" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">signal</text>
