<text x="254" y="236" text-anchor="end" font-size="13" font-weight="normal" fill="#222222">I<tspan dy="4" font-size="0.75em">1</tspan><tspan dy="-4"> </tspan></text>
<text x="388" y="236" text-anchor="start" font-size="13" font-weight="normal" fill="#222222">I<tspan dy="4" font-size="0.75em">2</tspan><tspan dy="-4"> </tspan></text>
