<text x="405" y="82" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">ring 3</text>
<rect x="490" y="90" width="30" height="34" rx="6" fill="#fbd9b5" stroke="#222222"/>
<text x="505" y="82" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">ring 4</text>
<rect x="580" y="90" width="34" height="16" rx="0" fill="#7fa7d6" stroke="#222222"/>
