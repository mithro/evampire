<text x="250" y="226" text-anchor="start" font-size="12" font-weight="normal" fill="#c0392b">at a higher voltage: spreads on from ring 1 to ring 2</text>
<line x1="130" y1="74" x2="190" y2="74" stroke="#222222" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<line x1="130" y1="68" x2="130" y2="90" stroke="#666666" stroke-width="1"/>
<text x="140" y="40" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">≈ ⅓ of the flat</text>
<text x="140" y="54" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">depletion width</text>
<line x1="20" y1="410" x2="620" y2="410" stroke="#222222" stroke-width="1"/>
<line x1="20" y1="280" x2="20" y2="410" stroke="#222222" stroke-width="1"/>
<text x="12" y="350.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222" transform="rotate(-90 12 350.0)">surface potential</text>
<polyline points="20,290.0 130,290.0 190,316.4 220,316.4 290,342.8 320,342.8 390,366.8 420,366.8 490,389.6 520,389.6 580,410.0 620,410.0" stroke="#2e86de" stroke-width="2.5" fill="none"/>
<text x="26" y="286" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">V</text>
<text x="205" y="310.4" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">V − ΔV₁</text>
<text x="305" y="336.8" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">V − ΔV₂</text>
<text x="405" y="360.8" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">V − ΔV₃</text>
<text x="505" y="383.6" text-anchor="middle" font-size="11" font-weight="normal" fill="#222222">V − ΔV₄</text>
<text x="400" y="22" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">each ring sits a fixed step below the one inside it</text>
