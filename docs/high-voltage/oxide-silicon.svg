<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270" font-family="sans-serif" font-size="13">
<rect width="640" height="270" fill="white"/>
<text x="20" y="24" text-anchor="start" font-size="14" font-weight="bold" fill="#222222">Thickness that holds 57 V, to scale</text>
<text x="192" y="69" text-anchor="end" font-size="12" font-weight="normal" fill="#222222">oxide at 10 MV/cm</text>
<rect x="200" y="50" width="11.4" height="28" rx="0" fill="#e8e8e8" stroke="#222222"/>
<text x="219.4" y="69" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">57 nm</text>
<text x="192" y="113" text-anchor="end" font-size="12" font-weight="normal" fill="#222222">oxide at 6 MV/cm</text>
<rect x="200" y="94" width="19.0" height="28" rx="0" fill="#e8e8e8" stroke="#222222"/>
<text x="227.0" y="113" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">95 nm</text>
<text x="192" y="157" text-anchor="end" font-size="12" font-weight="normal" fill="#222222">oxide at 4 MV/cm</text>
<rect x="200" y="138" width="28.4" height="28" rx="0" fill="#e8e8e8" stroke="#222222"/>
<text x="236.4" y="157" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">142 nm</text>
<text x="192" y="201" text-anchor="end" font-size="12" font-weight="normal" fill="#222222">silicon, an ideal even fall</text>
<rect x="200" y="182" width="360.0" height="28" rx="0" fill="#dbe8f5" stroke="#222222"/>
<text x="568.0" y="201" text-anchor="start" font-size="12" font-weight="normal" fill="#222222">1.8 µm</text>
<text x="320" y="250" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">oxide's critical field is 20 to 33 times silicon's</text>
</svg>
