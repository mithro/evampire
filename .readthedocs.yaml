# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - graphviz
  jobs:
    # Fail the build if a page mentions a standard without linking
    # to it, or if a rendered page contains an error box, an unreferenced
    # figure or table number, or a diagram without alt text, that Sphinx does
    # not report as a warning.
    pre_build:
      - python docs/check_source.py docs
    post_build:
      - python docs/check_html.py $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
